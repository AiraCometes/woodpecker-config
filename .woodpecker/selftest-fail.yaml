# notify.sh の組み方（README の「使い方」）の自己テスト: わざと落ちるワークフロー。手動実行で NOTIFY_SELFTEST=1 のときだけ流れる
when:
  - event: manual
    evaluate: 'NOTIFY_SELFTEST == "1"'

skip_clone: true

steps:
  - name: fail
    image: jdxcode/mise:2026.11.2-debian
    commands:
      - echo 'failing on purpose, so selftest-notify runs'
      - exit 1
