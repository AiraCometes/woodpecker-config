# notify.sh の組み方（README の「使い方」）の自己テスト: selftest-fail が落ちたときだけ流れ、このリポジトリに Issue を作る。
# test は落ちないので、どれか1つが落ちれば流れることも確かめる。selftest-absent は流れないワークフローの代わりで、
# optional なら知らせのワークフローが外されないことを確かめる
when:
  - event: manual
    evaluate: 'NOTIFY_SELFTEST == "1"'
    status: [failure]

depends_on:
  - name: selftest-fail
    optional: true
  - name: test
    optional: true
  - name: selftest-absent
    optional: true

steps:
  - name: notify
    image: jdxcode/mise:2026.11.2-debian
    environment:
      GITHUB_TOKEN:
        from_secret: github_issue_token
    commands:
      - bash notify.sh
