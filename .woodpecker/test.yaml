# cache.sh・notify.sh・ci-times.sh の確かめ（Bats と ShellCheck）。キャッシュは使わない（確かめる側が確かめられる仕組みに頼らないため）。
when:
  - event: [push, pull_request]
    branch: main
  - event: manual

steps:
  - name: test
    image: jdxcode/mise:2026.11.2-debian
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends bats shellcheck > /dev/null
      - shellcheck -S warning cache.sh notify.sh ci-times.sh tests/*.bats
      - bats tests
